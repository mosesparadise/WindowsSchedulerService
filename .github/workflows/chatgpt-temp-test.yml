name: ChatGPT temporary narration generation

on:
  push:
    branches:
      - chatgpt-live-demo-audio-temp-20260722
      - chatgpt-live-demo-audio-final-20260722
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install British neural speech generator
        run: python -m pip install --quiet edge-tts
      - name: Generate narration chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, time, zlib
          chunk = int(os.environ['CHUNK'])
          parts = sorted(pathlib.Path('.github/chatgpt-temp').glob('narration.part*'))
          packed = ''.join(path.read_text().strip() for path in parts)
          print('Payload parts:', len(parts), 'characters:', len(packed), 'sha256:', hashlib.sha256(packed.encode()).hexdigest())
          segments = json.loads(zlib.decompress(base64.b64decode(packed)).decode('utf-8'))
          out = pathlib.Path('out')
          out.mkdir(exist_ok=True)
          selected = [(i, s) for i, s in enumerate(segments) if i % 5 == chunk]
          manifest = []
          failures = []
          log_lines = []
          for index, segment in selected:
              stem = f"{index:02d}_{segment['id']}"
              media = out / f"{stem}.mp3"
              subtitles = out / f"{stem}.vtt"
              cmd = ['edge-tts', '--voice', segment['voice'], f"--rate={segment['rate']}", f"--pitch={segment['pitch']}", '--text', segment['text'], '--write-media', str(media), '--write-subtitles', str(subtitles)]
              ok = False
              for attempt in range(1, 4):
                  try:
                      result = subprocess.run(cmd, text=True, capture_output=True, timeout=45)
                      log_lines.append(f"{stem} attempt {attempt} rc={result.returncode}\n{result.stdout}\n{result.stderr}")
                      if result.returncode == 0 and media.exists() and media.stat().st_size > 1000:
                          ok = True
                          break
                  except subprocess.TimeoutExpired:
                      log_lines.append(f"{stem} attempt {attempt} timed out after 45 seconds")
                  time.sleep(attempt * 2)
              if not ok:
                  failures.append(stem)
              manifest.append({**segment, 'index': index, 'media': media.name, 'subtitles': subtitles.name, 'generated': ok})
              time.sleep(0.4)
          (out / f'manifest_chunk_{chunk}.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (out / f'generation_chunk_{chunk}.log').write_text('\n\n'.join(log_lines), encoding='utf-8')
          (out / f'failures_chunk_{chunk}.txt').write_text('\n'.join(failures), encoding='utf-8')
          print('Chunk', chunk, 'generated', sum(1 for item in manifest if item['generated']), 'of', len(manifest), 'segments')
          PY
      - name: Upload narration chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-collection-narration-chunk-${{ matrix.chunk }}
          path: out
          if-no-files-found: error
          retention-days: 1
