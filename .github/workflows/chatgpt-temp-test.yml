name: ChatGPT temporary narration generation

on:
  push:
    branches: [chatgpt-live-demo-audio-temp-20260722]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install British neural speech generator
        run: python -m pip install --quiet edge-tts
      - name: Generate segmented narration and subtitles
        run: |
          python - <<'PY'
          import base64, json, pathlib, subprocess, time, zlib
          packed = pathlib.Path('.github/chatgpt-temp/narration_segments.zlib.b64').read_text().strip()
          segments = json.loads(zlib.decompress(base64.b64decode(packed)).decode('utf-8'))
          out = pathlib.Path('out')
          out.mkdir(exist_ok=True)
          manifest = []
          failures = []
          log_lines = []
          for index, segment in enumerate(segments):
              stem = f"{index:02d}_{segment['id']}"
              media = out / f"{stem}.mp3"
              subtitles = out / f"{stem}.vtt"
              cmd = ['edge-tts', '--voice', segment['voice'], '--rate', segment['rate'], '--text', segment['text'], '--write-media', str(media), '--write-subtitles', str(subtitles)]
              ok = False
              for attempt in range(1, 4):
                  result = subprocess.run(cmd, text=True, capture_output=True)
                  log_lines.append(f"{stem} attempt {attempt} rc={result.returncode}\n{result.stdout}\n{result.stderr}")
                  if result.returncode == 0 and media.exists() and media.stat().st_size > 1000:
                      ok = True
                      break
                  time.sleep(attempt * 2)
              if not ok:
                  failures.append(stem)
              manifest.append({**segment, 'index': index, 'media': media.name, 'subtitles': subtitles.name, 'generated': ok})
              time.sleep(0.4)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (out / 'transcript.txt').write_text('\n\n'.join(f"[{s['chapter']}] {s['speaker']}: {s['text']}" for s in segments), encoding='utf-8')
          (out / 'generation.log').write_text('\n\n'.join(log_lines), encoding='utf-8')
          (out / 'failures.txt').write_text('\n'.join(failures), encoding='utf-8')
          if failures:
              raise SystemExit('Failed segments: ' + ', '.join(failures))
          PY
      - name: Package narration files
        run: |
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          zip -q -r credit_collection_narration.zip out
          ls -lh credit_collection_narration.zip
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-collection-british-narration-zip
          path: credit_collection_narration.zip
          if-no-files-found: error
          retention-days: 1
